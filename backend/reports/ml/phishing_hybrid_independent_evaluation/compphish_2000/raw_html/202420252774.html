      <h1>Оставьте заявку</h1>

      <form  class="main__form leadForm form" id="form">
        <input type="hidden" name="countryCode" value="ru" />
        <input type="hidden" name="utm_term" value="{subid}" /><input type="hidden" name="subid" value="{subid}" />
        <input
          class="contact-us__field form-field"
          name="forename"
          placeholder="Имя"
          required
          title="Пожалуйста введите ваше имя на русском языке"
          type="text"
        />
        <input
          class="contact-us__field form-field"
          name="surname"
          placeholder="Фамилия"
          required
          title="Пожалуйста введите вашу фамилию на русском языке"
          type="text"
        />
        <input
          class="contact-us__field form-field"
          name="email"
          placeholder="E-mail"
          required
          title="Пожалуйста введите ваш E-mail"
          type="email"
        />
        <input
          class="contact-us__field form-field phone phone-ru"
          name="phone"
          placeholder="Телефон"
          required
          title="Ваш номер телефона не может начинаться с +7 или +"
          type="tel"
        />

        <div class="check">
          <label class="check-root" for="" style="margin: 8px 0">
            <input class="chek" checked type="checkbox" />
            <span class="title-check"
              >Подтвердите, что Вы являетесь гражданином Российской
              Федераци</span
            >
          </label>
          <label class="check-root" for="" style="margin-bottom: 8px">
            <input
              class="chek"
              checked
              style="margin-top: 5px"
              type="checkbox"
            />
            <span class="title-check" style="margin-top: 5px"
              >Возможности платформы доступны только совершеннолетним
              пользователям.<br />Подтвердите, что вы старше 21го года</span
            >
          </label>
        </div>
        <button
          class="button button--primary"
          id="submitbtn"
          name="submit"
          type="submit"
        >
          Отправить
        </button>
      </form>
