# NGINX Edge Reverse Proxy Configuration for SignalCheck
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # --- Edge Request Resource Protection ---
    # client_max_body_size: Enforces a strict 1 MB maximum HTTP request body size.
    # Selected because maximum legitimate text payloads (10,000 chars) are <50 KB.
    # Rejects large stream dumps and memory-exhaustion payloads before reaching Python.
    client_max_body_size 1m;

    # client_body_timeout: Mitigates Slowloris attacks by terminating slow body uploads (10s).
    client_body_timeout 10s;

    # proxy timeouts: Prevents long-running thread hanging (15s).
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    # --- Connection and Request Rate Zones ---
    # Track binary remote address (4 bytes IPv4, 16 bytes IPv6)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream backend service (FastAPI container on internal Docker network)
    upstream backend_api {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream frontend static asset service
    upstream frontend_spa {
        server frontend:80;
    }

    # Map client HTTP Host header to appropriate HTTPS redirect target:
    # - In local development with non-standard ports (e.g. Host: localhost:8080 or 127.0.0.1:8080),
    #   redirect to the mapped HTTPS port 8443 (e.g. localhost:8443).
    # - In standard environments (Host: example.com:80 or example.com without port),
    #   redirect to standard HTTPS on port 443 (e.g. https://example.com) without hardcoding domains.
    map $http_host $redirect_target {
        default                 $host;
        "~^(?<h>[^:]+):8080$"   $h:8443;
        "~^(?<h>[^:]+):80$"     $h;
        "~^(?<h>[^:]+)$"        $h;
    }

    # --- HTTP Server: Redirect all HTTP traffic to HTTPS ---
    server {
        listen 80;
        server_name localhost;

        # Standard ACME challenge path for Certbot SSL issuance
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$redirect_target$request_uri;
        }
    }

    # --- HTTPS Production Server ---
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        # TLS Certificate paths (mounted via Docker volume)
        # Note: In development, self-signed test certs are used; in production, mount Let's Encrypt / CA certs.
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Modern TLS Ciphers & Protocols (Mozilla Intermediate Recommendation)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Defense-in-Depth HTTP Security Headers (Emitted at Edge) ---
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Content-Security-Policy (Allow Swagger UI cdn and self, with explicit connect-src 'self')
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; font-src 'self' data:; frame-ancestors 'none';" always;

        # Limit concurrent connections per IP
        limit_conn conn_limit 20;

        # --- API Reverse Proxy ---
        # Proxies /api/ and /health endpoints to internal FastAPI backend

        # Dedicated route for APK static analysis with increased body limit (25 MB) and timeout
        location /api/apk/ {
            limit_req zone=api_limit burst=5 nodelay;
            limit_req_status 429;

            client_max_body_size 25m;
            client_body_timeout 30s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forwarded headers: NGINX is trusted by FastAPI
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # OpenAPI Swagger documentation (optional; accessible in staging)
        location /docs {
            proxy_pass http://backend_api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /redoc {
            proxy_pass http://backend_api/redoc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # --- Frontend Single Page Application ---
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
