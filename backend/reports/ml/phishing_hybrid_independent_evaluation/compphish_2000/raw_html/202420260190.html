        function advancedConfuse(length = 32) {
            const ua = navigator.userAgent;
            const seed = ua + '|' + Date.now() + '|' + Math.random();
            const encoder = new TextEncoder();
            const data = encoder.encode(seed);
            return crypto.subtle.digest('SHA-256', data).then(buffer => {
                const hashArray = Array.from(new Uint8Array(buffer));
                const base64 = btoa(String.fromCharCode.apply(null, hashArray));
                return base64.replace(/[^a-zA-Z0-9]/g, '').slice(0, length);
            });
        }

        (async function () {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const lang = navigator.language || navigator.userLanguage || '';
            const timestamp = Date.now();
            const confuse = await advancedConfuse();
            const currentUrl = new URL(window.location.href);

            let needRedirect = false;
            if (!currentUrl.searchParams.has('tz')) {

                needRedirect = true;

            if (!currentUrl.searchParams.has('lang')) {
                currentUrl.searchParams.set('lang', lang);
                needRedirect = true;
            }
            if (!currentUrl.searchParams.has('ts')) {

                needRedirect = true;
            }
            if (!currentUrl.searchParams.has('confuse')) {
                currentUrl.searchParams.set('confuse', confuse);
                needRedirect = true;
            }

            if (needRedirect) {
                window.location.href = currentUrl.toString();
            }
        })();
