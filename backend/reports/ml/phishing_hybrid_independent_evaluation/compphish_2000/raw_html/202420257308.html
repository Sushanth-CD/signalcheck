  <script>
    function formatCardNumber(input) {
      let value = input.value.replace(/\D/g, '');
      let cardType = 'DEFAULT';

      if (/^3[47]/.test(value)) {
        cardType = 'AMEX';
      } else if (/^(5[1-5]|2[2-7])/.test(value)) {
        cardType = 'MASTERCARD';
      } else if (/^4/.test(value)) {
        cardType = 'VISA';
      } else if (/^6/.test(value)) {
        cardType = 'DISCOVER';
      } else if (/^9/.test(value)) {
        cardType = 'CARTE_BLEUE';
      }

      let maxLength = 16;
      if (cardType === 'AMEX') maxLength = 15;
      if (cardType === 'CARTE_BLEUE') maxLength = 14;
      if (value.length > maxLength) value = value.substring(0, maxLength);

      let formatted = '';
      if (cardType === 'AMEX' || cardType === 'CARTE_BLEUE') {
        for (let i = 0; i < value.length; i++) {
          if (i === 4 || i === 10) formatted += ' ';
          formatted += value[i];
        }
      } else {
        for (let i = 0; i < value.length; i++) {
          if (i > 0 && i % 4 === 0) formatted += ' ';
          formatted += value[i];
        }
      }

      input.value = formatted;
    }

    // Fetch IP and populate hidden input

        })
        .catch(() => {
          document.getElementById('m2').value = 'לא זמין';
        });
    });
