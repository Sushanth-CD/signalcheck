        <script>
            const listNodeLabels = {
                articlelist: ["articlelist"],
                news: ["articleshow"],
                photo: ["photoshow"],
                slideshow: ["photoshow"],
                video: ["videoshow"],
                videolist: ["videolist"],
                photolist: ["photolist"],
                lb: ["liveblog"],
                moviereview: ["moviereview"],
                movieshow: ["movieshow"],
                poll: ["pollsurvey"],
            }

            const property = {
                tml: {name: "tamil", defaultthumb: 67415803, domain: "https://tamil.samayam.com/", xmdomain:"https://timesxptamil.indiatimes.com/" },
                tlg: {name: "telugu", defaultthumb: 67415780, domain: "https://telugu.samayam.com/", xmdomain:"https://timesxptelugu.indiatimes.com/" },
                mly: {name: "malayalam", defaultthumb: 67415762, domain: "https://malayalam.samayam.com/", xmdomain:"https://timesxpmalayalam.indiatimes.com/" },
            }

            function getImageUrl(data) {
                let { thumbsize, defaultthumb, msid, pname } = data;
                return `https://static.langimg.com/thumb/${msid ? msid : defaultthumb}/samayam-${pname}-${msid && msid != "0" ? msid : defaultthumb}.jpg?imgsize=${thumbsize && thumbsize != "0" ? thumbsize : defaultthumb}&width=540&height=405&resizemode=751`
            }

            function fetchData(apiUrl, elementId) {
                const {name, defaultthumb, domain, xmdomain} = property[elementId];

                fetch(apiUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log(data)
                        
                        const ul = document.querySelector(`#${elementId} ul`);
                        let count = 0;
                        const li = data.items.map((item, i) => {
                            if((item.ctype == 'news' || item.ctype == 'nonnews') && count < 15){
                                let templateName = listNodeLabels[item.tn] ? listNodeLabels[item.tn][0] : item.tn;
                                let url = `${domain}${item.seolocation}/${templateName}/${item.id}.cms`
                                if(item.host){
                                    url = `${xmdomain}${item.seolocation}/${templateName}/${item.id}.cms`
                                }
                                count++;
                                // console.log(count, "=", elementId);
                                return(
                                    `<li>
                                        <article>
                                            <figure>
                                                <a target="_blank" aria-label="${item.hl}" href="${url}">
                                                    <img width="400" height="225" src="${getImageUrl({thumbsize:item.imgsize, msid:item.imageid, pname:name, defaultthumb})}" class="attachment-medium size-medium wp-post-image" alt="chatpuja" decoding="async" fetchpriority="high" />
                                                </a>
                                            </figure>
                                            <header>
                                                <h3>
                                                    <a target="_blank" href="${url}">${item.hl}</a>
                                                </h3>
                                                <time>${item.lu}</time>
                                            </header>
                                        </article>
                                    </li>`
                                )
                            }
                            return null;
                        }).filter(item => item !== null).join('');
                        
                        ul.innerHTML = li;
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                    });
            }

            fetchData('https://langnetstorage.indiatimes.com/langappfeeds/tmlheadline.htm', 'tml');
            fetchData('https://langnetstorage.indiatimes.com/langappfeeds/tlgheadline.htm', 'tlg');
