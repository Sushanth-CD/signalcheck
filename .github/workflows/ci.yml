name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    name: Backend Pytest (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "./backend[dev]"

      - name: Run backend pytest suite (Fast non-slow suite on push)
        if: github.event_name == 'push'
        env:
          SIGNALCHECK_RATE_LIMIT_STORAGE_URL: memory://
        run: |
          pytest backend/tests/ -v -m "not slow"

      - name: Run backend pytest suite (Full suite on pull request)
        if: github.event_name == 'pull_request'
        env:
          SIGNALCHECK_RATE_LIMIT_STORAGE_URL: memory://
        run: |
          pytest backend/tests/ -v

  frontend-build:
    name: Frontend Build (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend build
        run: |
          cd frontend
          npm run build

  worker-container-hardening:
    name: Worker Container Hardening Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend worker image
        run: |
          docker build -t signalcheck-apk-worker:ci -f backend/Dockerfile .

      - name: Create compose internal network and verify compose configuration
        run: |
          docker compose config
          # Create internal network mirroring docker-compose signalcheck-internal
          docker network create --internal signalcheck-ci-internal

      - name: Assert 1 - Non-root user execution
        run: |
          UID_GID=$(docker run --rm \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            signalcheck-apk-worker:ci id -u)
          echo "Worker executed with UID: $UID_GID"
          if [ "$UID_GID" != "10001" ]; then
            echo "FAILED: Worker is running as UID $UID_GID instead of 10001 (non-root)"
            exit 1
          fi

      - name: Assert 2 - Read-only root filesystem prevents writing outside /tmp
        run: |
          set +e
          docker run --rm \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            signalcheck-apk-worker:ci touch /app/evil_probe.txt 2>&1 | grep -i "Read-only file system"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FAILED: Root filesystem allowed writing outside /tmp!"
            exit 1
          fi
          echo "Verified: Writes outside /tmp are blocked with 'Read-only file system'."

      - name: Assert 3 - Outbound network access is strictly blocked on compose internal network
        run: |
          set +e
          # Verify compose project network definition sets internal: true
          COMPOSE_INTERNAL=$(docker compose config --format json | jq -r '.networks["signalcheck-internal"].internal')
          echo "docker-compose signalcheck-internal is internal: $COMPOSE_INTERNAL"
          if [ "$COMPOSE_INTERNAL" != "true" ]; then
            echo "FAILED: docker-compose.yml does not set internal: true on signalcheck-internal"
            exit 1
          fi

          # Attempt outbound ping/curl to external IP on the internal-only network
          docker run --rm \
            --network signalcheck-ci-internal \
            --user 10001:10001 \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            signalcheck-apk-worker:ci python -c "import urllib.request; urllib.request.urlopen('http://1.1.1.1', timeout=3)" 2>&1 | grep -iE "Network is unreachable|timed out|URLError"
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FAILED: Outbound network egress was not blocked on internal network!"
            exit 1
          fi
          echo "Verified: Outbound network egress failed as expected on internal network."

  compose-integration-apk-pipeline:
    name: Compose Integration APK Worker Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose services (redis, backend, apk-worker)
        run: |
          docker compose up -d redis backend apk-worker

      - name: Wait for backend service health
        run: |
          echo "Waiting for backend to be healthy..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' signalcheck-backend 2>/dev/null || echo '"starting"')
            if [ "$STATUS" = '"healthy"' ]; then
              echo "Backend is healthy!"
              break
            fi
            echo "Backend status: $STATUS (waiting $i/30)..."
            sleep 2
          done

      - name: Assert worker is running as non-root with read-only rootfs
        run: |
          WORKER_USER=$(docker inspect --format='{{.Config.User}}' signalcheck-apk-worker)
          echo "Worker user configured: $WORKER_USER"
          if [ "$WORKER_USER" != "10001:10001" ]; then
            echo "FAILED: apk-worker user is not 10001:10001!"
            exit 1
          fi

          WORKER_READONLY=$(docker inspect --format='{{.HostConfig.ReadonlyRootfs}}' signalcheck-apk-worker)
          echo "Worker read-only rootfs: $WORKER_READONLY"
          if [ "$WORKER_READONLY" != "true" ]; then
            echo "FAILED: apk-worker does not have read-only rootfs!"
            exit 1
          fi

          ACTUAL_UID=$(docker exec signalcheck-apk-worker id -u)
          echo "Live worker process UID: $ACTUAL_UID"
          if [ "$ACTUAL_UID" != "10001" ]; then
            echo "FAILED: Live worker process is not running as UID 10001!"
            exit 1
          fi

      - name: Run APK static analysis through container stack and assert results
        id: test_pipeline
        run: |
          set -e
          FIXTURE_PATH="backend/tests/fixtures/ANDROGUARD_TESTS_TestActivity.apk"
          if [ ! -f "$FIXTURE_PATH" ]; then
            echo "FAILED: Fixture APK not found at $FIXTURE_PATH"
            exit 1
          fi

          # Ensure fixture is copied into the backend container for test requests and assertions
          docker cp "$FIXTURE_PATH" signalcheck-backend:/tmp/TestActivity.apk

          # Upload APK via backend container
          echo "Submitting APK to backend..."
          JOB_ID=$(python .github/scripts/upload_apk.py)
          echo "Enqueued Job ID: $JOB_ID"

          # Poll for job completion
          python .github/scripts/poll_job.py "$JOB_ID" /tmp/job_result.json

          # Assertions on result schema and Redis key cleanup
          python .github/scripts/assert_result.py "$JOB_ID" /tmp/job_result.json

          # Type-aware raw scan across all Redis keys with positive control assertion
          python .github/scripts/redis_leak_scan.py

          echo "Container-mode pipeline completed successfully!"

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker logs signalcheck-backend --tail 100
          echo "=== APK Worker Logs ==="
          docker logs signalcheck-apk-worker --tail 100
          echo "=== Redis Logs ==="
          docker logs signalcheck-redis --tail 100

      - name: Tear down compose stack
        if: always()
        run: |
          docker compose down -v
