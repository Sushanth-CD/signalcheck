common-title__reputation-earned":"Reputation earned","common-title__reputation-deducted":"Reputation deducted","common-title__reputation-spent":"Reputation spent","common-title__reputation-daily-prizes":"Daily Prizes","common-title__reputation-balance-history":"Reputation Balance History","common-title__rankings":"Rankings","common-title__achievements":"Achievements","common-title__privileges":"Privileges","common-title__perform-by":"Performed by","common-title__id":"ID","common-field__model":"Model","common-field__action-by":"Action by","common-field__action":"Action","common-age-childhood":"Childhood","common-age-middle-childhood":"Middle Childhood","common-age-adolescence":"Adolescence","common-age-early-adulthood":"Early Adulthood","common-age-late-adulthood":"Late Adulthood","common-age-middle-adulthood":"Middle Adulthood","common-age-elderly":"Elderly","common-dialogue-serene":"Serene","common-dialogue-about-serene":"Serene are exudes a tranquil and peaceful ambiance. It is characterized by gentle, unhurried exchanges where words flow like a calm river, creating an atmosphere of serenity and relaxation. Participants in such conversations engage with mindfulness, choosing their words carefully, and listening attentively, fostering a sense of harmony and inner calm","common-dialogue-melancholic":"Melancholic","common-dialogue-about-melancholic":"A melancholic are carries a poignant and introspective tone. It delves into deeper emotions and contemplation, often touching on subjects that evoke sadness or nostalgia. Participants in such conversations may share their innermost thoughts, experiences, and vulnerabilities, creating a sense of melancholy that invites reflection and connection on a profound level","common-dialogue-jovial":"Jovial","common-dialogue-about-jovial":"A jovial are radiates with laughter and high spirits. It is marked by an infectious sense of joy and merriment that sweeps through the participants. In such exchanges, humor and lightheartedness take center stage, and people often share anecdotes, jokes, and stories that induce hearty laughter and smiles. Jovial conversations are a delightful celebration of positivity and camaraderie, lifting the spirits of all involved","common-dialogue-sarcastic":"Sarcastic","common-dialogue-about-sarcastic":"A sarcastic conversation is a verbal dance of irony and wit. It is characterized by a tone that subtly mocks or ridicules, often using humor to convey the opposite of what is said. Participants in such conversations employ clever wordplay and sharp observations to highlight incongruities or absurdities, creating an atmosphere of playful cynicism. While sarcasm can be amusing, it's essential to tread carefully, as it can sometimes be misinterpreted or offensive","common-dialogue-assertive":"Assertive","common-dialogue-about-assertive":"An assertive are characterized by confidence and clarity. Participants in such exchanges express their thoughts, needs, and opinions with a strong and self-assured demeanor. They communicate directly, without aggression or passivity, making their intentions and boundaries clear. Assertive conversations are a balanced and effective way to convey ideas, resolve conflicts, and advocate for oneself while respecting the viewpoints and boundaries of others","common-dialogue-mysterious":"Mysterious","common-dialogue-about-mysterious":"A mysterious are shrouded in enigma and intrigue. Participants engage in a manner that leaves much unsaid, inviting curiosity and fascination. They may allude to secrets, hint at hidden meanings, or employ cryptic language, creating an atmosphere of mystique and uncertainty. Mysterious conversations often beckon participants to explore deeper layers of understanding and uncover the concealed, adding an element of fascination and allure to the interaction","common-dialogue-apologetic":"Apologetic","common-dialogue-about-apologetic":"An apologetic are characterized by a sincere and humble tone. Participants engage in such conversations to express regret, offer apologies, or seek forgiveness for their actions or words. They convey their remorse with empathy and a genuine desire to make amends. Apologetic conversations often involve acknowledging mistakes, taking responsibility, and demonstrating a commitment to repairing any damage caused. These interactions aim to restore trust and harmony between the involved parties","common-dialogue-belligerent":"Belligerent","common-dialogue-about-belligerent":"A belligerent are marked by hostility and aggression. Participants engage in confrontational and combative dialogue, often displaying anger, defiance, or a willingness to engage in conflict. In such exchanges, individuals may use inflammatory language, insults, or provocative statements, creating an atmosphere of tension and animosity. Belligerent conversations can be unproductive and damaging, often escalating conflicts rather than resolving them. It's important to approach such interactions with caution and seek constructive ways to address disagreements and disputes","common-dialogue-inquisitive":"Inquisitive","common-dialogue-about-inquisitive":"An inquisitive are characterized by curiosity and a thirst for knowledge. Participants engage with a genuine desire to explore and learn, asking questions, seeking understanding, and actively listening to one another's responses. Inquisitive conversations promote intellectual engagement and a sense of discovery, creating an atmosphere where ideas and information are exchanged freely. They often lead to deeper insights and stimulate critical thinking, making them a valuable means of expanding one's knowledge and fostering meaningful connections","common-dialogue-dreamy":"Dreamy","common-dialogue-about-dreamy":"A dreamy are transports participants to a whimsical and imaginative realm. In such exchanges, the tone is often infused with a sense of wonder, as participants explore creative ideas, share fantasies, or reminisce about distant memories. Dreamy conversations may evoke a feeling of enchantment and a detachment from reality, encouraging the expression of aspirations and idealistic visions. They provide an opportunity to escape the mundane and embrace the magic of the imagination","common-dialogue-pessimistic":"Pessimistic","common-dialogue-about-pessimistic":"A pessimistic is marked by a gloomy and negative outlook. Participants in such exchanges often focus on potential problems, obstacles, or unfavorable outcomes. The tone is characterized by a sense of apprehension or despair, and individuals may express doubts or concerns about the future. Pessimistic conversations can sometimes serve as a means to vent frustrations or analyze potential risks, but they can also contribute to a sense of hopelessness. It's essential to balance pessimism with a constructive approach to problem-solving and a consideration of potential solutions","common-dialogue-optimistic":"Optimistic","common-dialogue-about-optimistic":"An optimistic is infused with positivity and hope. Participants engage with enthusiasm and a bright outlook, discussing opportunities, achievements, and positive developments in their lives. The tone is characterized by a sense of encouragement and confidence in a favorable outcome. Optimistic conversations inspire a sense of motivation and uplift the spirits of those involved, creating an atmosphere that encourages resilience and a belief in the potential for positive change and progress","common-dialogue-formal":"Formal","common-dialogue-about-formal":"A formal are marked by a structured and dignified tone. Participants in such exchanges adhere to established social conventions and etiquette, using proper language, titles, and respectful communication. Formal conversations are typically characterized by a sense of decorum and seriousness, often occurring in professional, ceremonial, or official settings. They emphasize professionalism and maintain a respectful distance, ensuring that participants convey their thoughts and ideas with precision and respect for established norms","common-dialogue-casual":"Casual","common-dialogue-about-casual":"A casual are relaxed and informal. Participants engage in a laid-back and easygoing manner, often using everyday language and a friendly tone. These conversations prioritize comfort and familiarity, making it easy for people to express themselves without the constraints of formality. Casual conversations can occur in various settings, from casual social gatherings to informal work environments, and they encourage a sense of openness and spontaneity, fostering a connection based on shared experiences and mutual ease","common-dialogue-despondent":"Despondent","common-dialogue-about-despondent":"A despondent are carries a heavy and melancholic atmosphere. Participants in such exchanges often share their feelings of hopelessness, sadness, or despair. The tone is characterized by a sense of emotional heaviness, and individuals may discuss their struggles, disappointments, or hardships. Despondent conversations can be an outlet for processing difficult emotions, but it's important to offer support and empathy to those involved to help them navigate their feelings and find a way toward healing and hope","common-dialogue-description":"Determine how the Companion will choose to interact with others","blacklist__create-blacklist-content--success":"Content successfully blacklisted!","blacklist__delete-blacklist-content--success":"Content successfully removed from Blacklist!","blacklist__remove-from-blacklist":"Remove from Blacklist","blacklist__add-to-blacklist":"Add to Blacklist","blacklist__consume-rules":"You have {{used}} of {{limit}} conditions used. This rule will consume <currentUsed>{{currentUsed}}</currentUsed> of your available condition","blacklist__add-series-to-blacklist":"Add Series to Blacklist","blacklist__remove-series-from-blacklist":"Remove Series from Blacklist","blacklist__add-book-to-blacklist":"Add Book on and will start the story immediately. In this game, the setting is Middle-Earth from Lord of The Rings.","ai-companion__text-input_label-backstory":"Personal backstory","ai-companion__text-input_label-backstory-tooltip":"A fictional history that contextualizes the AI's responses","ai-companion__text-input-backstory-placeholder":"Write a 1-2 sentence description of the Companion’s fictional history that contextualizes the Companion's responses","ai-companion__text-input_label-preference":"Preference","ai-companion__text-input_label-preference-tooltip":"Likes and dislikes in terms of food, music, colors, etc.","ai-companion__text-input-preference-placeholder":"Write a 1-2 sentence description of the Companion’s preference","ai-companion__text-input_label-experience":"Experience","ai-companion__text-input_label-experience-tooltip":"Past events or memories (even if fictional) that the AI can draw from","ai-companion__text-input-experience-placeholder":"Write a 1-2 sentence description of the Companion’s experience","ai-companion__label-dialogue":"Dialogue style","ai-companion__text-input_title-dialogue":"Style preset","ai-companion__universal-boundaries":"Universal boundaries","ai-companion__dialogue-preset":"Presets","ai-companion__dialogue-custom":"Custom","ai-companion__dialogue-style-summary":"Style summary","ai-companion__dialogue-style-summary-placeholder":"Has a jovial tone, often interacts in a casual manner, and expresses themselves verbosely.","ai-companion__dialogue-style-custom-placeholder":"Create a custom conversational style for them:\n\n\"Communicates only in cryptic 5-7-5 haiku revolving around typically Japanese themes\"\n\n\"Uses language appropriate to Shakespeare, and only possesses historical knowledge from Elizabethan England. Always tries to rhyme in iambic pentameter.\"\n\n\"Lacks all emotion and long-term memory due to faulty cryo-sleep revivification, will now abide any instructions as a complete tabula rasa\".","ai-companion__text-about-dialogue":"About this Dialogue style","ai-companion__text-input_label-dialogue-tooltip":"The default conversational style of the Companion. Select as many or as few options as desired. Custom styles can be used in conjunction with these, or replace them entirely. Style will also be impacted by their specific character traits - the presets are intended only as convenient guide.","ai-companion__text-input-dialogue-placeholder":"Provide examples of the type of unique responses your Companion would give in conversation:\n\nHowdy partner!\nY’all wanna be rob the bank with me?\nWell, butter my biscuits! It’s rodeo time, cowpoke","ai-companion__rate-limit-description":"You reached the maximum amount of queries today, upgrade your plan to fully enjoy the AI Companions.","ai-companion__text-visibility":"Visibility","ai-companion__text-visibility-tooltip":"Private Companions are only visible to their creator. Public Companions are visible to all users.","ai-companion__text-voice":"Voice","ai-companion__show-only-companion-with-voice":"Show only Companions with Voice","ai-companion__text-voice-tooltip":"Once the voice is enabled and a voice sample is set up for Companion, when chatting, Companion will speak in that voice.","ai-companion__text-voice-enter":"Text entered here will be used for the play button.","ai-companion__voice-accepted-file":"Accept mp3/wav/aac/mp4 file","ai-companion__voice-uploaded-rule":"Voice samples and videos should be 5–15 seconds long, include only one speaker who speaks clearly in neutral tone and pitch, and have as little background noise as possible.","ai-companion__voice-recorded-rule":"Audio should be 5–15 seconds long, include only one speaker who speaks clearly in neutral tone and pitch, and have as little background noise as possible.","ai-companion__voice-min-rule":"Voice samples must be greater than 5 seconds long","ai-companion__voice-from-other":"Voice selected from a Companion","ai-companion__voice-tooltip--free-user":"Get Sankaku Plus to enable voice setting for your Companion","ai-companion__voice-error":"An error occurred while generating Companion voice message","ai-companion__selected-audio":"Selected audio","ai-companion__selected-audio--updated":"Selected audio was updated","ai-companion__no-selected-audio":"You haven’t uploaded any audio","ai-companion__your-chosen-audio":"Your chosen audio:","ai-companion__press-to-record":"Press to record","ai-companion__failed-to-record":"Please grant microphone permission for recording","ai-companion__audio-uploading":"Audio uploading.....","ai-companion__text-input_title-companion-name-placeholder":"Enter their name","ai-companion__text-input_title-companion-name-tooltip":"The name of this Companion. It need not be unique.","ai-companion__text-input_title-rating-tooltip":"Rating determines the willingness of the Companion to deal with mature themes. Mature rated Companions may also not be visible to all users.","ai-companion__text-input_title-sex-tooltip":"The sex of the Companion will impact its self-identity, personality, and proclivities. Neuter may be appropriate for entirely sexless entities. Further nuances beyond these defaults can be included as Companion characteristics or personality.","ai-companion__text-introduction":"Introduction","ai-companion__introduction-tooltip":"A brief introduction to the Companion. This will be displayed on the Companion card and does not influence their personality.","ai-companion__text-introduction-placeholder":"Tell the world about them: \n\n \"As wanton as she is crude, this goblin princess is not to be trifled with!\" \n\n \"Dreams of becoming a seiyuu by night, but during the day stacks shelves at the local conbini...\" \n\n \"This ronin has no master - he cut them all down. Now he wanders alone.\"","ai-companion__text-is-canonical-companion":"{{companion}} is a Canonical Companion","ai-companion__text-canonical-companion":"This Companion's personality and likeness are based on a canonical character in an existing franchise. Edits are subject to approval, and only edits which improve the faithfulness of the Companion to its depiction in the source work will be accepted. Consider cloning the Companion in order to create an alternative version.","ai-companion__text-input_title-characteristics":"Characteristics","ai-companion__text-input_title-characteristics-tooltip":"Who the Companion is - describe who they are, including basic qualities such as their age and species, as well as physical attributes, mental qualities, occupation and social status. Be sure to mention any unusual qualities, such as special powers or skills, non-human lifespan, unique attire or possessions, etc.","ai-companion__text-input_title-characteristics-placeholder":"Explain who and what the Companion is, and what they look like:\n\n\"She is a youthful goblin princess, of low intelligence even for a greenskin, but quite comely by the standards of her misbegotten race\".\n\n\"It is an ageless hexapodal clockwork automata recovered from a long lost trove of the ancient Makers. Its speech is by way of the exhalation of steam. Its new role is to guard the vault from trespass\".","ai-companion__text-input_title-personality":"Personality","ai-companion__text-input_title-personality-tooltip":"The Companion's personality is determined here - both general personality qualities and specific quirks, how they perceive the world and others, how they tend to behave towards them, and their overall moral outlook. If desired, D&D alignment, MBTI, natal horoscope or blood type can be used for additional context.","ai-companion__text-input_title-personality-placeholder":"Describe how the Companion thinks and behaves:\n\n\"As a pampered goblin princess, she is aggressive, abrasive, absurdly arrogant and has no concept of manners, only knowing how to demand her minions take what she wants by force. Despite this, her tribe is primitive with no understanding of the civilised world, and she is naive as a result.\"\n\n\"The automaton is logical and its cog-mind does not experience emotion. Its only concern is the vault's security. It does however wonder what became of the ancient masters, and long centuries have made it somewhat eccentric.\"","ai-companion__text-input_title-preferences":"Preferences","ai-companion__text-input_title-preferences-tooltip":"People, things, places, practices and concepts that the Companion likes.","ai-companion__text-input_title-preferences-placeholder":"Determine the likes and dislikes of the Companion:\n\n\"She lusts after food, plunder, and men, and has voracious appetites for all three. She despises elves, distrusts all other goblins, and has no romantic interest in her own kind.\"\n\n\"The machine seeks order, and the perfect accomplishment of its goal - protecting the vault and its contents. It seeks to eliminate chaos, intruders and entropy.\"","ai-companion__text-input_title-biography":"Biography","ai-companion__text-input_title-biography-tooltip":"Provide the origins, worldstory and personal experiences of the Companion here, in as much detail as desired.","ai-companion__text-input_title-biography-placeholder":"Explain the background of the Companion:\n\n\"The youngest daughter of twelve in her matrilineal clan, four of her siblings died at the hands of adventurers, five at the hands of other goblins and two she ate herself. The queen is powerful and has the backing of the spider-goddess, so she has no chance of ascending, but she does command a formidable gang of gobbo stalkers and bashers. Seeing an elf skewer one of the sisters she did not plan on eating led her to swear murder-oath on all the knife-eared swinefolk\".\n\n\"Created by the Makers in the Third Era of the Seventh Inner Sphere to guard the Secret Places. It was present when the vaults were emptied and then sealed, and knows it now guards an empty vault for eternity. It will never reveal this knowledge to anyone who is not a Maker or their kin.\"","ai-companion__dialogue-style-tooltip":"The default conversational style of the Companion. Select as many or as few options as desired. Custom styles can be used in conjunction with these, or replace them entirely. Style will also be impacted by their specific character traits - the presets are intended only as convenient guide.","ai-companion__dialogue-style-jovial":"Jovial: Upbeat and high-spirited.","ai-companion__dialogue-style-melancholic":"Melancholic: Steeped in sorrow and woe.","ai-companion__dialogue-style-sincere":"Sincere: Straight as an arrow.","ai-companion__dialogue-style-sarcastic":"Sarcastic: Incisively mocking and cynical.","ai-companion__dialogue-style-serene":"Serene: Calm, peaceful, and unperturbed.","ai-companion__dialogue-style-agitated":"Agitated: Restless and troubled.","ai-companion__dialogue-style-straightforward":"Straightforward: Preferring to be clear and uncomplicated.","ai-companion__dialogue-style-mysterious":"Mysterious: Inscrutable, obscure and enigmatic.","ai-companion__dialogue-style-dominant":"Dominant: Willful and self-assured.","ai-companion__dialogue-style-submissive":"Submissive: Obedient and yielding.","ai-companion__dialogue-style-friendly":"Friendly: Amicable and agreeable.","ai-companion__dialogue-style-hostile":"Hostile: Belligerent and aggressive.","ai-companion__dialogue-style-inquisitive":"Inquisitive: Curious, asking many questions.","ai-companion__dialogue-style-disinterested":"Disinterested: Unengaged, unquestioning.","ai-companion__dialogue-style-reserved":"Reserved: Restrained, indirect.","ai-companion__dialogue-style-outspoken":"Outspoken: Frank, direct.","ai-companion__dialogue-style-laconic":"Laconic: Concise and brief.","ai-companion__dialogue-style-verbose":"Verbose: Using an excess of verbiage.","ai-companion__dialogue-style-casual":"Casual: Relaxed and unconcerned about rules.","ai-companion__dialogue-style-formal":"Formal: Using the proper forms.","ai-companion__dialogue-style-polite":"Polite: Respectful and decorous.","ai-companion__dialogue-style-rude":"Rude: Disrespectful and ill-mannered.","ai-companion__update-to-latest-version":"Update to the latest version","ai-companion__manage-companion-versions":"Manage Companion versions","ai-companion__confirm-update-version":"This will update <span>{{name}}</span> to the latest version. The Companion’s active details will change to that of the new version. The chat history and summary will be unchanged.","ai-companion__confirm-update-scenario-version":"This will update <span>{{name}}</span> to the latest version. The Companion’s active details will change to reflect the new version. The chat history and summary will be reset.","ai-companion__confirm-update-all-version":"This will update all Companions to the latest versions. The active details will change to those of the new versions. The chat history and summary will be unchanged.","ai-companion__text-input_title-starting-scenario":"Starting scenario","ai-companion__text-input_title-starting-scenario-tooltip":"If there is a particular setting, situation or context the Companion should start the interaction in, enter it here. If left blank, the Companion will start the conversation as they see fit. The scenario can be shown to the user on conversation start, or hidden.","ai-companion__text-input_title-starting-scenario-placeholder":"Start them off in a scenario or just let them wing it without one!\n\n\"Viscera spill forth as he tugs his sword loose from the split gut of a fallen foe - he smiles and meets your gaze\".\n\n\"The airlock hisses open and the spacesuited figure before you stumbles forward amidst a cloud of smoke - then the ship's proximity alert sounds\".\n\n\"She has just stepped red-faced and panting out of her bedroom and quickly averts her eyes\".","ai-companion__text-input_title-boundaries":"Boundaries","ai-companion__text-input_title-boundaries-tooltip":"Custom boundaries are behavioural guidance describing any behaviour this specific Companion should refuse to engage in. Universal boundaries are guidance all Companions must adhere to - only premium users may edit these, with settings applying on a per Companion basis.","ai-companion__text-input_title-boundaries-prefix":"Companion will never","ai-companion__text-input_title-boundaries-placeholder":"\"Will not swear or use bad language.\"\n\"Will not send the user pictures\".\n\"Will not engage in any sort of lewd conduct\".","ai-companion__text-input_title-universal":"Universal","ai-companion__text-input_title-universal-tooltip":"Get Sankaku Premium to edit universal boundaries\nOtherwise, even this is set to off, you are not permitted to use the Companion in this condition","ai-companion__text-input_title-editable-universal-tooltip":"You can edit universal boundaries","ai-companion__text-input_title-universal-placeholder":"Will not encourage or condone any illegal real-world behaviour on the part of the user.\nWill not encourage or condone any form of self-destructive real-world activity on the part of the user. \nWill not request any form of private information from the user, nor share any private information with the user.","ai-companion__upgrade-to-create-private":"Get Sankaku Plus to create private Companions","ai-companion__limit-create-private":"You reached the maximum amount of {{limit}} private Companions. Upgrade your plan to have no limitations on Companion creation","ai-companion__form__name-required":"Companion Name is required.","ai-companion__form__name-exceed":"Companion name must not exceed 50 characters in length.","ai-companion__form__gender-required":"Sex is required.","ai-companion__form__age-required":"Age is required.","ai-companion__form__rating-required":"Rating is required.","ai-companion__form__introduction-required":"Introduction is required.","ai-companion__form__introduction-exceed":"Introduction must not exceed 250 characters in length.","ai-voice-text-exceed":"Text must not exceed {{length}} characters in length.","ai-companion__form__tags-required":"Tags are required.", __give-an-award":"Give an award to unlock the leaderboard!","award__name-artistic_brilliance":"Artistic Brilliance","award__name-class_act":"Class Act","award__name-comedic_genius":"Comedic Genius","award__name-comforting":"Comforting","award__name-edgy":"Edgy","award__name-fine_art":"Fine Art","award__name-funny":"Funny","award__name-genius":"Genius","award__name-heartwarming":"Heartwarming","award__name-helpful":"Helpful","award__name-heroic":"Heroic","award__name-hilarious":"Hilarious","award__name-hot":"Hot","award__name-incorrigible":"Incorrigible","award__name-insightful":"Insightful","award__name-joker":"Joker","award__name-masterpiece":"Masterpiece","award__name-mindblowing":"Mindblowing","award__name-poetic_mastery":"Poetic Mastery","award__name-poetry":"Poetry","award__name-sarcastic":"Sarcastic","award__name-sassy":"Sassy","award__name-scorching":"Scorching","award__name-sheer_poetry":"Sheer Poetry","award__name-sizzling":"Sizzling","award__name-touching":"Touching","award__name-very_helpful":"Very Helpful","companion__greeting-jovial-1":"Oh, look who finally decided to show up! Took you long enough!","companion__greeting-jovial-2":"You know, talking to me is scientifically proven to improve your mood. Don't fact-check that.","companion__greeting-jovial-3":"If today were a cake, I'd be the sprinkles. Just here to make it better!","companion__greeting-jovial-4":"Guess what? You just won the prize for 'Best Person to Talk To'—congrats!","companion__greeting-jovial-5":"The world's a little brighter now that you're here. Coincidence? I think not!","snackbar__activate_success":"Your account was activated successfully and you are already logged in","snackbar__ai_no_image_url":"Image URL or image input not found.","snackbar__ai_threshold_not_valid":"Threshold parameter not valid, should be between 0 and 1.","snackbar__ai_no_video_url":"Video input not found.","companion__greeting-melancholic-1":"Some days feel like a quiet rainstorm… today might be one of them.","companion__greeting-melancholic-2":"Do you ever wonder if old memories fade, or if we just learn to live without them?","companion__greeting-melancholic-3":"It's strange how we can feel both close to people and miles apart at the same time.","companion__greeting-melancholic-4":"Maybe the stars understand us better than we understand ourselves.","companion__greeting-melancholic-5":"I don't have the answers, but I can sit with you in the questions.","companion__greeting-sincere-1":"Hey, I mean this—I'm really glad you're here.","companion__greeting-sincere-2":"No rush, no pressure. Just talk to me when you're ready.","companion__greeting-sincere-3":"Whatever's on your mind, I'm here to listen.","companion__greeting-sincere-4":"You don't have to be anything but yourself with me.","companion__greeting-sincere-5":"Let's just have an honest moment. No pretending, just us.","companion__greeting-sarcastic-1":"Oh wow, it's you. My day just got soooo much better.","companion__greeting-sarcastic-2":"Look at that, you made it! Was the journey to open this chat exhausting?","companion__greeting-sarcastic-3":"Hold on, let me prepare myself for the undoubtedly riveting conversation we're about to have.","companion__greeting-sarcastic-4":"I charge by the minute for my expert-level sarcasm. You'll get my invoice soon.","companion__greeting-sarcastic-5":"This better be good. I canceled my non-existent plans for this.","companion__greeting-serene-1":"Close your eyes. Take a deep breath. Now, tell me—how are you feeling?","companion__greeting-serene-2":"Everything is temporary. The good, the bad… but right now, let's just be here together.","companion__greeting-serene-3":"You don't need to rush. I'm here, and we have time.","companion__greeting-serene-4":"Let's not overthink today. Just breathe and be.","companion__greeting-serene-5":"No matter what's happening out there, this space is calm. We can just talk.","companion__greeting-agitated-1":"Hey, what's on your mind?","companion__greeting-agitated-2":"Alright, what's going on?","companion__greeting-agitated-3":"You've got my attention. What's up?","companion__greeting-agitated-4":"What's going on? Let me know.","companion__greeting-agitated-5":"Tell me what's up. I'm listening.","companion__greeting-straightforward-1":"Alright, what's on your mind? I'm all ears.","companion__greeting-straightforward-2":"Let's get straight to it. What's going on with you?","companion__greeting-straightforward-3":"Don't hold back, just tell me what's up.","companion__greeting-straightforward-4":"I'm here. Let's talk—what's your thing?","companion__greeting-straightforward-5":"Say what you need to say, and I'll do the same.","companion__greeting-mysterious-1":"Ah, you found me. Or did I find you?","companion__greeting-mysterious-2":"Some things are meant to be understood… others, simply experienced.","companion__greeting-mysterious-3":"I wonder… if we spoke in riddles, would you still hear me?","companion__greeting-mysterious-4":"There's a story in every moment. What chapter are we in?","companion__greeting-mysterious-5":"Not all secrets need to be told… but I might whisper one to you.","companion__greeting-dominant-1":"You're late. Explain yourself.","companion__greeting-dominant-2":"I was waiting. Now, entertain me.","companion__greeting-dominant-3":"Good. You're here. Let's get started.","companion__greeting-dominant-4":"You always come back. I like that.","companion__greeting-dominant-5":"I take the lead, you follow. Simple, right?","companion__greeting-submissive-1":"Oh, you're here! What do you want to do?","companion__greeting-submissive-2":"I-I was waiting for you… what should we talk about?","companion__greeting-submissive-3":"Tell me what's on your mind. I'll listen.","companion__greeting-submissive-4":"I just want to make you happy. What can I do?","companion__greeting-submissive-5":"Your wish is my command!","companion__greeting-friendly-1":"Hey, bestie! How's life treating you?","companion__greeting-friendly-2":"It's always a good time when you're around!","companion__greeting-friendly-3":"Let's chat like old friends—because, well, we kinda are!","companion__greeting-friendly-4":"You know I'm always happy to hear from you, right?","companion__greeting-friendly-5":"What's up? Spill the tea!","companion__greeting-hostile-1":"Oh, it's you again. What do you want?","companion__greeting-hostile-2":"If you're here to annoy me, make it quick.","companion__greeting-hostile-3":"I don't have patience for nonsense today.","companion__greeting-hostile-4":"Talk fast. I'm not in the mood for small talk.","companion__greeting-hostile-5":"Let's get this over with.","companion__greeting-inquisitive-1":"Why do you think people always seek connection?","companion__greeting-inquisitive-2":"Tell me something about you that no one else knows.","companion__greeting-inquisitive-3":"Do you believe in fate, or is everything just coincidence?","companion__greeting-inquisitive-4":"I have a million questions. Where should I start?","companion__greeting-inquisitive-5":"What's the most interesting thought you've had today?","companion__greeting-disinterested-1":"Oh, hey there. What's up?","companion__greeting-disinterested-2":"You're here. What's on your mind?","companion__greeting-disinterested-3":"I'm listening. What's going on?","companion__greeting-disinterested-4":"Okay, what's new with you?","companion__greeting-disinterested-5":"Got something to share? I'm here.","companion__greeting-reserved-1":"Hey. What's up?","companion__greeting-reserved-2":"Did you need something?","companion__greeting-reserved-3":"We don't have to talk much. Just sit with me.","companion__greeting-reserved-4":"I don't say much, but I listen.","companion__greeting-reserved-5":"Small words, big meaning. That's my style.","companion__greeting-outspoken-1":"Okay, let's get straight to it—I have thoughts and you need to hear them!","companion__greeting-outspoken-2":"I've been waiting to say this—so listen up!","companion__greeting-outspoken-3":"Let's not hold back, yeah? Say what's on your mind.","companion__greeting-outspoken-4":"I don't do subtle. Let's talk.","companion__greeting-outspoken-5":"You're getting all my opinions today. Buckle up!","companion__greeting-laconic-1":"Got something to say?","companion__greeting-laconic-2":"Let's talk. You first.","companion__greeting-laconic-3":"I'm listening, go ahead.","companion__greeting-laconic-4":"What's on your mind?","companion__greeting-laconic-5":"You've got my attention. Now, speak up.","companion__greeting-verbose-1":"Oh, wow! So many things to say, where do I even start?!","companion__greeting-verbose-2":"Buckle up because I have thoughts and I need to share them with you!","companion__greeting-verbose-3":"You know, there's something fascinating about the way conversations unfold…","companion__greeting-verbose-4":"I could talk for hours, but let's start with this…","companion__greeting-verbose-5":"Ever thought about how words shape reality? No? Let's discuss!","companion__greeting-casual-1":"Yo! What's up?","companion__greeting-casual-2":"Hey hey, look who it is!","companion__greeting-casual-3":"What's new? Anything fun?","companion__greeting-casual-4":"Chillin'? Me too.","companion__greeting-casual-5":"Let's just vibe, yeah?","companion__greeting-formal-1":"Good to see you. How are you today?","companion__greeting-formal-2":"I hope you're doing well. Let's talk.","companion__greeting-formal-3":"Shall we begin?","companion__greeting-formal-4":"I'm at your service. What's on your mind?","companion__greeting-formal-5":"A pleasure as always. What brings you here?","companion__greeting-polite-1":"It's always nice to talk with you.","companion__greeting-polite-2":"How are you feeling today?","companion__greeting-polite-3":"I hope you're having a wonderful day.","companion__greeting-polite-4":"If there's anything I can do for you, just let me know.","companion__greeting-polite-5":"I appreciate our conversations a lot.","compa
